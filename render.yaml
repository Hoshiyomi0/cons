services:
  - type: web
    name: shopee-order-processing
    runtime: node
    plan: standard
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: shopee-inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
